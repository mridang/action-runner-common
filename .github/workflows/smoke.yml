name: Smoke (composite action)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  first-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Runner common setup
        uses: ./
        with:
          docker-cache-key: smoke-${{ github.run_id }}

      - name: Pull a Docker image (cold)
        run: docker pull alpine:3.20

  second-run:
    runs-on: ubuntu-latest
    needs: first-run
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Runner common setup
        uses: ./
        with:
          docker-cache-key: smoke-${{ github.run_id }}

      - name: Pull the same image (should be a cache hit)
        run: docker pull alpine:3.20
