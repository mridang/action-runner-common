name: Runner Common Setup

description: >
  Common first-step setup applied to every workflow — runner hardening
  via step-security/harden-runner, generic XDG cache over ~/.cache, and
  Docker image layer caching via an in-house bin-packing cache stage
  built on @actions/cache@v4 + the Docker Engine API. Pin this once at
  the top of every job.

author: mridang
branding:
  color: blue
  icon: shield

inputs:
  harden-egress-policy:
    description: >
      Passed to step-security/harden-runner. One of "audit" or "block".
    required: false
    default: audit
  harden-allowed-endpoints:
    description: >
      Newline-separated list of allowed endpoints, used when
      harden-egress-policy is "block".
    required: false
    default: ''
  harden-disable-sudo:
    description: >
      Passed to step-security/harden-runner. Disables sudo on the runner.
    required: false
    default: 'false'

  generic-cache:
    description: >
      Enable a generic always-on cache over ~/.cache (XDG cache home).
      Tools that respect XDG_CACHE_HOME (pip, Go build cache, gh CLI,
      Helm, oras, others) get cross-run persistence for free. Set to
      "false" to skip.
    required: false
    default: 'true'

  docker-cache:
    description: >
      Enable Docker image caching. Set to "false" to skip entirely.
    required: false
    default: 'true'
  docker-cache-key:
    description: >
      Override the cache key. When empty, a sensible default is derived
      from runner.os and a slugified workflow name. The default
      deliberately excludes the job name so all jobs in a workflow share
      one cache; different workflows get separate caches.
    required: false
    default: ''
  docker-cache-read-only:
    description: >
      If "true", restore the Docker cache but do not save it on cache miss.
      Recommended for PR branches to avoid cache pollution.
    required: false
    default: 'false'
  docker-cache-max-fraction:
    description: >
      Fraction of free disk to use as the docker-cache budget at post-step
      time. Float between 0 and 1. Default 0.6. The post-step bin-packs
      the delta of newly-pulled images (first-fit-decreasing) into this
      budget and skips any that don't fit, never failing the job on
      disk-full.
    required: false
    default: '0.6'
  docker-cache-free-disk:
    description: >
      If "true", remove ~20-25 GB of well-known pre-installed bloat from
      the runner (Android SDK, .NET, Haskell, CodeQL, PyPy, etc.) before
      the cache restore. Use this on workflows that pull many large
      images (e.g. polyglot test matrices) and would otherwise blow the
      runner's ~14 GB free-disk budget. Adds ~30 seconds.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Harden runner
      uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
      with:
        egress-policy: ${{ inputs.harden-egress-policy }}
        allowed-endpoints: ${{ inputs.harden-allowed-endpoints }}
        disable-sudo: ${{ inputs.harden-disable-sudo }}

    - name: Ensure ~/.cache exists
      if: ${{ inputs.generic-cache == 'true' }}
      shell: bash
      run: mkdir -p "$HOME/.cache"

    - name: Generic cache (~/.cache)
      if: ${{ inputs.generic-cache == 'true' }}
      uses: actions/cache@v4
      with:
        path: ~/.cache
        key: runner-common-cache-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          runner-common-cache-${{ runner.os }}-

    - name: Resolve Docker cache key
      if: ${{ inputs.docker-cache == 'true' }}
      id: docker-cache-key
      shell: bash
      env:
        OVERRIDE_KEY: ${{ inputs.docker-cache-key }}
        WORKFLOW: ${{ github.workflow }}
        OS: ${{ runner.os }}
      run: |
        if [ -n "$OVERRIDE_KEY" ]; then
          echo "value=$OVERRIDE_KEY" >> "$GITHUB_OUTPUT"
        else
          # Slugify the workflow display name: GitHub's cache service rejects
          # keys containing spaces or non-ASCII chars (e.g. em-dashes) with a
          # 400. Replace any run of non-alphanumeric chars with a single dash
          # and trim leading/trailing dashes.
          SLUG=$(printf '%s' "$WORKFLOW" | LC_ALL=C tr -cs 'a-zA-Z0-9' '-' | sed 's/^-*//; s/-*$//')
          echo "value=docker-cache-$OS-$SLUG" >> "$GITHUB_OUTPUT"
        fi

    - name: Prepare Docker cache
      if: ${{ inputs.docker-cache == 'true' }}
      # GitHub Actions resolves `uses: ./...` from composite actions
      # against GITHUB_WORKSPACE, NOT against the composite's own repo
      # (see https://github.com/actions/runner/issues/646). We work around
      # that by referencing the sub-action via its full repo path pinned
      # to the same floating major tag this action publishes under. The
      # release workflow updates `v1` after every release, so the sub-
      # action always tracks the same major as the root.
      uses: mridang/action-runner-common/stages/docker-cache@v1
      with:
        key: ${{ steps.docker-cache-key.outputs.value }}
        read-only: ${{ inputs.docker-cache-read-only }}
        max-fraction: ${{ inputs.docker-cache-max-fraction }}
        free-disk: ${{ inputs.docker-cache-free-disk }}
