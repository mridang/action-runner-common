name: Docker image cache (internal)

description: >
  Internal stage of mridang/action-runner-common. Caches docker images
  pulled during the job via @actions/cache@v4 and `docker save`/`docker
  load`. Intended to be called only by the root composite — its public
  surface (inputs `key`, `read-only`) is not part of the action's public
  contract.

inputs:
  key:
    description: >
      The cache key. The root composite slugifies the workflow name and
      passes it here.
    required: true
  read-only:
    description: >
      If "true", restore the cache but do not save it.
    required: false
    default: 'false'
  max-fraction:
    description: >
      Fraction of free disk to use as the cache budget at post-step
      time. Float between 0 and 1. Defaults to 0.6 (leaves 40% headroom
      for the actions/cache compression and any subsequent post-steps).
    required: false
    default: '0.6'
  free-disk:
    description: >
      If "true", remove well-known pre-installed bloat from the runner
      (Android SDK, .NET, Haskell, CodeQL, PyPy, etc.) during the pre-
      step to free ~20-25 GB. Off by default because it adds ~30s and
      isn't needed on most jobs.
    required: false
    default: 'false'

outputs:
  cache-hit:
    description: '"true" if the cache was restored on the primary key.'

runs:
  using: node24
  main: dist/main.cjs
  post: dist/post.cjs
  # Save the cache regardless of whether the job's user-level steps
  # succeeded — a failed test should not throw away images that were
  # already pulled. Matches actions/cache@v4's internal semantics.
  post-if: always()
