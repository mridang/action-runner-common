name: Generic XDG cache (internal)

description: >
  Internal stage of mridang/action-runner-common. Caches ~/.cache via
  @actions/cache@v4 + tolerant tar (--ignore-failed-read,
  --warning=no-file-changed), so the post-step never fails when a
  container, ryuk cleanup, JVM cache, etc. is still writing during the
  cache save.

inputs:
  key:
    description: 'Cache key for the primary save/restore.'
    required: true
  restore-keys:
    description: >
      Newline-separated prefixes used as fallbacks when the primary
      key misses.
    required: false
    default: ''
  read-only:
    description: 'If "true", restore but do not save.'
    required: false
    default: 'false'
  debug:
    description: >
      If "true" (or when the runner has step-debug logging enabled,
      RUNNER_DEBUG=1), print a per-node size breakdown of the top of
      the cache tree on both restore and save.
    required: false
    default: 'false'

outputs:
  cache-hit:
    description: '"true" if the cache was restored on the primary key.'

runs:
  using: node24
  main: dist/main.cjs
  post: dist/post.cjs
  # Save the cache regardless of whether the job's user-level steps
  # succeeded. A failed test should not throw away the cache from work
  # that completed (image pulls, ~/.cache contents). actions/cache@v4
  # uses the same "always" semantics internally.
  post-if: always()
